<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Test</title>
</head>
<body>
    <h1>Button Test</h1>
    <button id="accountCreate">Create Account</button>
    <button id="importAccountLogin">Import Account</button>
    
    <script>
        document.getElementById("accountCreate").addEventListener("click", function() {
            alert("Create Account clicked!");
        });
        
        document.getElementById("importAccountLogin").addEventListener("click", function() {
            alert("Import Account clicked!");
        });
    </script>
</body>
</html>
